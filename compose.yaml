name: switch-squad-hpc

services:
  db:
    image: "timescale/timescaledb@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538"
    environment:
      POSTGRES_DB: hpc_logs
      POSTGRES_USER: hpc_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Create .env first}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Create .env first}"
      TS_TUNE_MEMORY: "2GB"
      TS_TUNE_NUM_CPUS: "2"
      TS_TUNE_MAX_CONNS: "30"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/project-db:ro
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hpc_admin -d hpc_logs"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  pgdata: